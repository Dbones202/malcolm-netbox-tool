[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-excel-importer"
version = "1.3.0"
description = "A self-contained Python CLI to validate and import devices, interfaces, and primary IPs into NetBox from Excel."
readme = "README.md"
authors = [{ name = "Malcolm NetBox Automation Team" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "pynetbox>=7.0.0",
    "openpyxl>=3.1.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "urllib3>=1.26.0"
]

[project.scripts]
netbox-excel-importer = "netbox_importer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
